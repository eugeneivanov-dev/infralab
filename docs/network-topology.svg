<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="Helvetica, Arial, sans-serif">
  <!-- ============ defs ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6670"/>
    </marker>
  </defs>

  <!-- ============ background ============ -->
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2933">Lab Network Topology</text>
  <text x="40" y="70" font-size="14" fill="#5c6670">Seven VLANs plus a management segment, deny-by-default L3 between them</text>

  <!-- ============ ingress column (top) ============ -->
  <!-- Internet -->
  <rect x="500" y="95" width="200" height="44" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="600" y="122" font-size="15" text-anchor="middle" fill="#323f4b">Internet</text>

  <line x1="600" y1="139" x2="600" y2="167" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ONT -->
  <rect x="500" y="170" width="200" height="44" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="600" y="190" font-size="15" text-anchor="middle" fill="#323f4b">Google Fiber ONT</text>
  <text x="600" y="206" font-size="12" text-anchor="middle" fill="#5c6670">8 Gbps</text>

  <line x1="600" y1="214" x2="600" y2="242" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- UDM -->
  <rect x="440" y="245" width="320" height="58" rx="8" fill="#1f2933" stroke="#1f2933"/>
  <text x="600" y="269" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">UDM Pro Max</text>
  <text x="600" y="289" font-size="12" text-anchor="middle" fill="#cbd2d9">gateway · L3 firewall · deny-by-default between VLANs</text>

  <line x1="600" y1="303" x2="600" y2="331" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Switching layer -->
  <rect x="380" y="334" width="440" height="52" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="600" y="355" font-size="15" text-anchor="middle" fill="#323f4b">UniFi switching &amp; Wi-Fi</text>
  <text x="600" y="373" font-size="12" text-anchor="middle" fill="#5c6670">Pro Max 24 PoE core · downstream PoE switches · U7 Pro APs</text>

  <!-- trunk line down to VLAN grid -->
  <line x1="600" y1="386" x2="600" y2="420" stroke="#5c6670" stroke-width="2"/>
  <line x1="150" y1="420" x2="1050" y2="420" stroke="#5c6670" stroke-width="2"/>
  <!-- drops to each column -->
  <line x1="262" y1="420" x2="262" y2="446" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="487" y1="420" x2="487" y2="446" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="712" y1="420" x2="712" y2="446" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="937" y1="420" x2="937" y2="446" stroke="#5c6670" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ VLAN grid ============ -->
  <!-- Row 1 -->

  <!-- Lab (expanded card, spans both rows, column 1) -->
  <rect x="150" y="450" width="225" height="360" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
  <text x="166" y="478" font-size="15" font-weight="bold" fill="#1f4c7c">Lab</text>
  <text x="359" y="478" font-size="12" text-anchor="end" fill="#4a6785">VLAN 2</text>
  <text x="166" y="496" font-size="12" fill="#4a6785">192.168.10.0/24</text>

  <!-- Proxmox cluster sub-block -->
  <rect x="166" y="510" width="193" height="88" rx="6" fill="#ffffff" stroke="#7da7d0" stroke-width="1.2"/>
  <text x="262" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f4c7c">Proxmox VE HA cluster</text>
  <text x="262" y="548" font-size="12" text-anchor="middle" fill="#323f4b">pve1 · pve2</text>
  <text x="262" y="564" font-size="11" text-anchor="middle" fill="#5c6670">ZFS · bidirectional replication</text>
  <text x="262" y="580" font-size="11" text-anchor="middle" fill="#5c6670">RHEL + Ubuntu fleets (Ansible)</text>

  <!-- DNS sub-block -->
  <rect x="166" y="608" width="193" height="40" rx="6" fill="#ffffff" stroke="#7da7d0" stroke-width="1.2"/>
  <text x="262" y="625" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4c7c">BIND 9 · ns1 / ns2</text>
  <text x="262" y="641" font-size="11" text-anchor="middle" fill="#5c6670">internal DNS, primary / secondary</text>

  <!-- CA sub-block -->
  <rect x="166" y="658" width="193" height="40" rx="6" fill="#ffffff" stroke="#7da7d0" stroke-width="1.2"/>
  <text x="262" y="675" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4c7c">step-ca</text>
  <text x="262" y="691" font-size="11" text-anchor="middle" fill="#5c6670">internal PKI, ACME issuance</text>

  <!-- Monitoring sub-block -->
  <rect x="166" y="708" width="193" height="40" rx="6" fill="#ffffff" stroke="#7da7d0" stroke-width="1.2"/>
  <text x="262" y="725" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4c7c">Prometheus · Grafana</text>
  <text x="262" y="741" font-size="11" text-anchor="middle" fill="#5c6670">monitoring &amp; alerting</text>

  <!-- NAS sub-block -->
  <rect x="166" y="758" width="193" height="40" rx="6" fill="#ffffff" stroke="#7da7d0" stroke-width="1.2"/>
  <text x="262" y="775" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f4c7c">Synology DS720+</text>
  <text x="262" y="791" font-size="11" text-anchor="middle" fill="#5c6670">NFS backup target · QDevice</text>

  <!-- Main -->
  <rect x="400" y="450" width="175" height="170" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="416" y="478" font-size="15" font-weight="bold" fill="#323f4b">Main</text>
  <text x="559" y="478" font-size="12" text-anchor="end" fill="#5c6670">VLAN 4</text>
  <text x="416" y="496" font-size="12" fill="#5c6670">192.168.30.0/24</text>
  <text x="416" y="524" font-size="12" fill="#323f4b">Trusted devices,</text>
  <text x="416" y="540" font-size="12" fill="#323f4b">workstations</text>

  <!-- Cameras -->
  <rect x="625" y="450" width="175" height="170" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="641" y="478" font-size="15" font-weight="bold" fill="#323f4b">Cameras</text>
  <text x="784" y="478" font-size="12" text-anchor="end" fill="#5c6670">VLAN 3</text>
  <text x="641" y="496" font-size="12" fill="#5c6670">192.168.20.0/24</text>
  <text x="641" y="524" font-size="12" fill="#323f4b">9 × UniFi G6</text>
  <text x="641" y="540" font-size="12" fill="#323f4b">(dome / turret / bullet)</text>

  <!-- VoIP -->
  <rect x="850" y="450" width="190" height="170" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="866" y="478" font-size="15" font-weight="bold" fill="#323f4b">VoIP</text>
  <text x="1024" y="478" font-size="12" text-anchor="end" fill="#5c6670">VLAN 8</text>
  <text x="866" y="496" font-size="12" fill="#5c6670">192.168.60.0/24</text>
  <text x="866" y="524" font-size="12" fill="#323f4b">2 × Cisco IP phones</text>

  <!-- Row 2 -->

  <!-- IoT -->
  <rect x="400" y="640" width="175" height="170" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="416" y="668" font-size="15" font-weight="bold" fill="#323f4b">IoT</text>
  <text x="559" y="668" font-size="12" text-anchor="end" fill="#5c6670">VLAN 5</text>
  <text x="416" y="686" font-size="12" fill="#5c6670">192.168.40.0/24</text>
  <text x="416" y="714" font-size="12" fill="#323f4b">Smart-home devices,</text>
  <text x="416" y="730" font-size="12" fill="#323f4b">isolated from LAN</text>

  <!-- Guest -->
  <rect x="625" y="640" width="175" height="170" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="641" y="668" font-size="15" font-weight="bold" fill="#323f4b">Guest</text>
  <text x="784" y="668" font-size="12" text-anchor="end" fill="#5c6670">VLAN 6</text>
  <text x="641" y="686" font-size="12" fill="#5c6670">192.168.50.0/24</text>
  <text x="641" y="714" font-size="12" fill="#323f4b">Isolated guest access</text>

  <!-- Default + Quarantine stacked in last cell -->
  <rect x="850" y="640" width="190" height="78" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="866" y="666" font-size="15" font-weight="bold" fill="#323f4b">Default</text>
  <text x="1024" y="666" font-size="12" text-anchor="end" fill="#5c6670">VLAN 1</text>
  <text x="866" y="684" font-size="11" fill="#5c6670">192.168.1.0/24 · management</text>
  <text x="866" y="702" font-size="12" fill="#323f4b">Network equipment</text>

  <rect x="850" y="732" width="190" height="78" rx="10" fill="#fdf3f0" stroke="#c76b5a" stroke-width="1.5"/>
  <text x="866" y="758" font-size="15" font-weight="bold" fill="#8c3b2e">Quarantine</text>
  <text x="1024" y="758" font-size="12" text-anchor="end" fill="#a8564a">VLAN 7</text>
  <text x="866" y="776" font-size="12" fill="#a8564a">192.168.90.0/24</text>
  <text x="866" y="794" font-size="11" fill="#8c3b2e">Unknown devices, port-isolated</text>

  <!-- ============ remote access column (left) ============ -->
  <rect x="40" y="95" width="300" height="291" rx="10" fill="#f0f7f1" stroke="#4f8a5b" stroke-width="1.5"/>
  <text x="56" y="123" font-size="15" font-weight="bold" fill="#2f5e38">Remote access</text>

  <rect x="56" y="140" width="268" height="62" rx="6" fill="#ffffff" stroke="#8ab894" stroke-width="1.2"/>
  <text x="70" y="162" font-size="13" font-weight="bold" fill="#2f5e38">WireGuard</text>
  <text x="70" y="180" font-size="11" fill="#5c6670">self-hosted VPN on a dedicated VM,</text>
  <text x="70" y="194" font-size="11" fill="#5c6670">UDP port-forward on the gateway</text>

  <rect x="56" y="212" width="268" height="62" rx="6" fill="#ffffff" stroke="#8ab894" stroke-width="1.2"/>
  <text x="70" y="234" font-size="13" font-weight="bold" fill="#2f5e38">Tailscale</text>
  <text x="70" y="252" font-size="11" fill="#5c6670">mesh overlay via NAS node,</text>
  <text x="70" y="266" font-size="11" fill="#5c6670">no inbound ports</text>

  <rect x="56" y="284" width="268" height="62" rx="6" fill="#ffffff" stroke="#8ab894" stroke-width="1.2"/>
  <text x="70" y="306" font-size="13" font-weight="bold" fill="#2f5e38">Cloudflare Tunnel</text>
  <text x="70" y="324" font-size="11" fill="#5c6670">outbound-only tunnel for</text>
  <text x="70" y="338" font-size="11" fill="#5c6670">published web services</text>

  <!-- arrow from remote access to UDM -->
  <line x1="340" y1="274" x2="437" y2="274" stroke="#4f8a5b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============ footer ============ -->
  <text x="40" y="880" font-size="12" fill="#7b8794">eugeneivanov.dev · lab environment · August 2026</text>
</svg>
